<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="theme-color" content="#10271b" />
  <title>SANPO-ROAD 散歩結果</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    :root{
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:#17231c;background:#eef3ef;
      --ink:#17231c;--muted:#6a786f;--green:#22633c;--green-2:#dff0e4;--card:#ffffff;
      --line:#dfe8e1;--shadow:0 18px 60px rgba(25,63,39,.10)
    }
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#dceee2 0,#eef3ef 38%,#f6f8f6 100%);min-height:100vh}
    .wrap{max-width:820px;margin:auto;padding:28px 16px 56px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:900;letter-spacing:.12em;color:#1f5d38;font-size:.92rem}.badge{font-size:.78rem;padding:8px 11px;border-radius:999px;background:#ffffffb8;border:1px solid var(--line);color:var(--muted);backdrop-filter:blur(8px)}
    .hero{background:linear-gradient(140deg,#123421,#1f6a3b 70%,#3e8555);color:#fff;border-radius:30px;padding:28px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:#ffffff12;right:-65px;top:-78px}.eyebrow{font-size:.82rem;opacity:.72}.hero h1{margin:.4rem 0 .3rem;font-size:clamp(1.7rem,4vw,2.45rem);line-height:1.15;position:relative;z-index:1}.date{font-size:.92rem;opacity:.8}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px;position:relative;z-index:1}.stat{background:#ffffff14;border:1px solid #ffffff20;border-radius:18px;padding:14px;backdrop-filter:blur(6px)}.stat span{display:block;font-size:.78rem;opacity:.72}.stat strong{display:block;font-size:1.22rem;margin-top:5px}
    .grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(260px,.75fr);gap:14px;margin-top:14px}.card{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 12px 36px rgba(27,59,37,.07);border:1px solid #e7eee8}.card h2{font-size:1rem;margin:0 0 12px}.muted{color:var(--muted);font-size:.9rem;line-height:1.6}
    #map{height:390px;border-radius:18px;overflow:hidden;background:#e9eee9}.privacy{display:flex;gap:12px;align-items:flex-start;background:#f4f8f5;border-radius:18px;padding:16px}.privacy-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:#dfeee3;font-size:1.1rem;flex:none}.privacy strong{display:block;margin-bottom:4px}.note{white-space:pre-wrap;line-height:1.8}.note.empty{color:var(--muted)}
    .route-off{display:none;min-height:240px;align-items:center;justify-content:center;text-align:center;padding:28px;background:linear-gradient(150deg,#f3f7f4,#e8f1eb);border:1px dashed #b9ccbe;border-radius:18px}.route-off .lock{font-size:2rem;margin-bottom:10px}.route-off b{display:block;font-size:1.08rem;margin-bottom:6px}.footer{text-align:center;margin-top:22px;color:#7b887f;font-size:.8rem;line-height:1.6}.error,.loading{padding:48px 20px;text-align:center;background:#fff;border-radius:24px;box-shadow:var(--shadow)}
    @media(max-width:720px){.grid{grid-template-columns:1fr}.hero{padding:22px}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}#map{height:330px}}
    @media(max-width:430px){.wrap{padding:18px 12px 42px}.hero{border-radius:24px}.card{border-radius:20px;padding:16px}.stats{grid-template-columns:1fr}.stat:last-child{grid-column:auto}#map{height:300px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="topbar">
      <div class="brand">SANPO-ROAD</div>
      <div class="badge">共有された散歩記録</div>
    </div>

    <section id="loading" class="loading">散歩結果を読み込んでいます…</section>

    <section id="content" hidden>
      <div class="hero">
        <div class="eyebrow">WALK SUMMARY</div>
        <h1 id="name">散歩記録</h1>
        <div class="date" id="date"></div>
        <div class="stats">
          <div class="stat"><span>距離</span><strong id="distance"></strong></div>
          <div class="stat"><span>時間</span><strong id="duration"></strong></div>
          <div class="stat"><span>平均ペース</span><strong id="pace"></strong></div>
        </div>
      </div>

      <div class="grid">
        <section class="card">
          <h2>ルート</h2>
          <div id="map"></div>
          <div id="routeOff" class="route-off">
            <div>
              <div class="lock">🔒</div>
              <b>地図は共有されていません</b>
              <div class="muted">プライバシー保護のため、このリンクにはルート座標が保存されていません。</div>
            </div>
          </div>
        </section>

        <div style="display:grid;gap:14px;align-content:start">
          <section class="card">
            <h2>共有について</h2>
            <div class="privacy">
              <div class="privacy-icon">🛡️</div>
              <div>
                <strong id="privacyTitle">プライバシー設定を確認中</strong>
                <div class="muted" id="privacyText"></div>
              </div>
            </div>
          </section>

          <section id="noteCard" class="card">
            <h2>ひとことメモ</h2>
            <div id="note" class="note empty">メモはありません。</div>
          </section>
        </div>
      </div>

      <div class="footer">このページは共有リンクを知っている人だけが閲覧できます。写真は共有されません。</div>
    </section>

    <section id="error" class="error" hidden>この共有リンクは見つからないか、利用できなくなっています。</section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    const fmtKm = m => `${(Math.max(0,m)/1000).toFixed(2)} km`;
    const fmtDuration = ms => {
      const s=Math.max(0,Math.floor(ms/1000));
      const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
      return h?`${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    };
    const fmtPace = (m,ms) => {
      if(m<50||ms<=0)return '--';
      const total=(ms/60000)/(m/1000);
      if(!isFinite(total)||total>99)return '--';
      const min=Math.floor(total),sec=Math.min(59,Math.round((total-min)*60));
      return `${min}:${String(sec).padStart(2,'0')}/km`;
    };

    async function load(){
      const token=location.pathname.split('/').filter(Boolean).pop()||'';
      try{
        const r=await fetch(`/api/share?token=${encodeURIComponent(token)}`);
        if(!r.ok)throw new Error('not found');
        const data=await r.json();

        document.getElementById('name').textContent=data.name||'散歩記録';
        document.getElementById('date').textContent=new Date(data.startedAt).toLocaleString('ja-JP',{dateStyle:'long',timeStyle:'short'});
        document.getElementById('distance').textContent=fmtKm(data.distanceMeters);
        document.getElementById('duration').textContent=fmtDuration(data.durationMs);
        document.getElementById('pace').textContent=fmtPace(data.distanceMeters,data.durationMs);

        if(data.note){
          const note=document.getElementById('note');
          note.textContent=data.note;
          note.classList.remove('empty');
        }

        const showMap=data.showMap!==false;
        const points=(data.points||[]).map(p=>[p.lat,p.lng]);
        if(showMap&&points.length){
          document.getElementById('privacyTitle').textContent='地図つきで共有';
          document.getElementById('privacyText').textContent='このリンクには散歩ルートが含まれています。';
          const map=L.map('map',{scrollWheelZoom:false});
          L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
          const line=L.polyline(points,{weight:6,opacity:.9,color:'#2b7547'}).addTo(map);
          L.circleMarker(points[0],{radius:7,color:'#1f5d38',fillOpacity:1}).addTo(map).bindTooltip('スタート');
          L.circleMarker(points[points.length-1],{radius:7,color:'#8f3d37',fillOpacity:1}).addTo(map).bindTooltip('ゴール');
          map.fitBounds(line.getBounds(),{padding:[28,28],maxZoom:17});
        }else{
          document.getElementById('map').style.display='none';
          document.getElementById('routeOff').style.display='flex';
          document.getElementById('privacyTitle').textContent='地図なしで共有';
          document.getElementById('privacyText').textContent='ルート座標は共有データに保存されていません。';
        }

        document.getElementById('loading').hidden=true;
        document.getElementById('content').hidden=false;
      }catch(e){
        document.getElementById('loading').hidden=true;
        document.getElementById('error').hidden=false;
      }
    }
    load();
  </script>
</body>
</html>
