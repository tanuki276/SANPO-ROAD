<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>SANPO-ROAD 散歩結果</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#16231c;background:#f4f7f4}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:auto;padding:24px 16px 48px}.brand{font-weight:800;letter-spacing:.08em;color:#2e6b44}.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 8px 30px #173e2420;margin-top:14px}.muted{color:#65756b;font-size:.9rem}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.stat{background:#f0f6f1;border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:1.1rem;margin-top:4px}.note{white-space:pre-wrap;line-height:1.7}#map{height:380px;border-radius:16px;overflow:hidden;background:#e9eee9}.error{padding:48px 16px;text-align:center}.footer{text-align:center;margin-top:20px;color:#7b887f;font-size:.8rem}@media(max-width:520px){.stats{grid-template-columns:1fr}.card{padding:16px}#map{height:310px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="brand">SANPO-ROAD</div>
    <section id="loading" class="card">散歩結果を読み込んでいます…</section>
    <section id="content" hidden>
      <div class="card">
        <div class="muted" id="date"></div>
        <h1 id="name" style="margin:.35rem 0 0;font-size:1.6rem"></h1>
        <div class="stats">
          <div class="stat"><span class="muted">距離</span><b id="distance"></b></div>
          <div class="stat"><span class="muted">時間</span><b id="duration"></b></div>
          <div class="stat"><span class="muted">平均ペース</span><b id="pace"></b></div>
        </div>
        <div id="map"></div>
      </div>
      <div id="noteCard" class="card" hidden>
        <div class="muted">ひとことメモ</div>
        <div id="note" class="note"></div>
      </div>
      <div class="footer">共有リンクを知っている人が閲覧できます。写真は共有されません。</div>
    </section>
    <section id="error" class="card error" hidden>この共有リンクは見つからないか、利用できなくなっています。</section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    const fmtKm = m => `${(Math.max(0,m)/1000).toFixed(2)} km`;
    const fmtDuration = ms => { const s=Math.max(0,Math.floor(ms/1000)); const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60; return h?`${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`; };
    const fmtPace = (m,ms) => { if(m<50||ms<=0)return '--'; const total=(ms/60000)/(m/1000); if(!isFinite(total)||total>99)return '--'; const min=Math.floor(total), sec=Math.min(59,Math.round((total-min)*60)); return `${min}:${String(sec).padStart(2,'0')}/km`; };
    async function load(){
      const token=location.pathname.split('/').filter(Boolean).pop()||'';
      try{
        const r=await fetch(`/api/share?token=${encodeURIComponent(token)}`);
        if(!r.ok)throw new Error('not found');
        const data=await r.json();
        document.getElementById('name').textContent=data.name||'散歩記録';
        document.getElementById('date').textContent=new Date(data.startedAt).toLocaleString('ja-JP',{dateStyle:'long',timeStyle:'short'});
        document.getElementById('distance').textContent=fmtKm(data.distanceMeters);
        document.getElementById('duration').textContent=fmtDuration(data.durationMs);
        document.getElementById('pace').textContent=fmtPace(data.distanceMeters,data.durationMs);
        if(data.note){document.getElementById('note').textContent=data.note;document.getElementById('noteCard').hidden=false;}
        const points=(data.points||[]).map(p=>[p.lat,p.lng]);
        if(points.length){
          const map=L.map('map',{scrollWheelZoom:false});
          L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
          const line=L.polyline(points,{weight:6,opacity:.85}).addTo(map);
          L.circleMarker(points[0],{radius:6}).addTo(map).bindTooltip('スタート');
          L.circleMarker(points[points.length-1],{radius:6}).addTo(map).bindTooltip('ゴール');
          map.fitBounds(line.getBounds(),{padding:[24,24],maxZoom:17});
        }
        document.getElementById('loading').hidden=true; document.getElementById('content').hidden=false;
      }catch(e){document.getElementById('loading').hidden=true;document.getElementById('error').hidden=false;}
    }
    load();
  </script>
</body>
</html>
