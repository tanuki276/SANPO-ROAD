name: Build SANPO-ROAD APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test debug build
        run: gradle --no-daemon --stacktrace --console=plain testDebugUnitTest assembleDebug

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/

  release-apk:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SANPO_STORE_PASSWORD: ${{ secrets.SANPO_STORE_PASSWORD }}
      SANPO_KEY_ALIAS: ${{ secrets.SANPO_KEY_ALIAS }}
      SANPO_KEY_PASSWORD: ${{ secrets.SANPO_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SANPO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$SANPO_STORE_PASSWORD"
          test -n "$SANPO_KEY_ALIAS"
          test -n "$SANPO_KEY_PASSWORD"
          echo "SANPO_KEYSTORE_PATH=$RUNNER_TEMP/sanpo-release.jks" >> "$GITHUB_ENV"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sanpo-release.jks"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test and build signed release APK
        run: gradle --no-daemon --stacktrace --console=plain testReleaseUnitTest assembleRelease

      - name: Verify release signature
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: sanpo-road-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/sanpo-release.jks"

  storage-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disk-size: 2048M
          script: gradle --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: room-test-results-and-schemas
          path: |
            app/build/reports/androidTests/
            app/schemas/

  cr11-data-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @electric-sql/pglite@0.5.10
      - run: node supabase/tests/cr11_metadata.test.mjs
      - run: node --test share-web/tests/share.test.mjs
