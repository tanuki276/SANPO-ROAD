name: Build SANPO-ROAD APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare build-only configuration
        shell: bash
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('id("org.jetbrains.kotlin.plugin.compose")\n', 'id("org.jetbrains.kotlin.plugin.compose")\n    id("org.jetbrains.kotlin.plugin.serialization")\n')
          marker = 'defaultConfig {\n'
          insert = 'defaultConfig {\n        manifestPlaceholders["MAPS_API_KEY"] = providers.gradleProperty("MAPS_API_KEY").orNull ?: "YOUR_GOOGLE_MAPS_API_KEY"\n'
          s = s.replace(marker, insert, 1)
          p.write_text(s)
          PY
          echo "MAPS_API_KEY=${MAPS_API_KEY:-YOUR_GOOGLE_MAPS_API_KEY}" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug -PMAPS_API_KEY="$MAPS_API_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sanpo-road-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
