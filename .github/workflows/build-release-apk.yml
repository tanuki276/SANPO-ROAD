name: Build signed release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    env:
      SANPO_STORE_PASSWORD: ${{ secrets.SANPO_STORE_PASSWORD }}
      SANPO_KEY_ALIAS: ${{ secrets.SANPO_KEY_ALIAS }}
      SANPO_KEY_PASSWORD: ${{ secrets.SANPO_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SANPO_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$SANPO_STORE_PASSWORD"
          test -n "$SANPO_KEY_ALIAS"
          test -n "$SANPO_KEY_PASSWORD"
          echo "SANPO_KEYSTORE_PATH=$RUNNER_TEMP/sanpo-release.jks" >> "$GITHUB_ENV"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sanpo-release.jks"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test and build release APK
        run: gradle --no-daemon --stacktrace --console=plain testReleaseUnitTest assembleRelease

      - name: Verify APK signature
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: sanpo-road-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/sanpo-release.jks"
